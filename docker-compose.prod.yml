services:
  db:
    image: postgres:16-alpine
    container_name: eazydoc_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-eazydoc_db}
      POSTGRES_USER: ${DATABASE_USER:-eazydoc_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-eazydoc_user} -d ${DATABASE_NAME:-eazydoc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  redis:
    image: redis:7-alpine
    container_name: eazydoc_redis_prod
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_backend_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RUN_MIGRATIONS=true
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_celery_prod
    restart: unless-stopped
    command: celery -A config worker -l INFO -c 4
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RUN_MIGRATIONS=false
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_celery_beat_prod
    restart: unless-stopped
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RUN_MIGRATIONS=false
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_frontend_prod
    restart: unless-stopped
    networks:
      - internal_network

  nginx:
    image: nginx:1.27-alpine
    container_name: eazydoc_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal_network

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  internal_network:
    driver: bridge

