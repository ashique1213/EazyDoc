services:
  db:
    image: postgres:16-alpine
    container_name: eazydoc_db_staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-eazydoc_staging_db}
      POSTGRES_USER: ${DATABASE_USER:-eazydoc_staging_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-eazydoc_staging_user} -d ${DATABASE_NAME:-eazydoc_staging_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_internal_network

  redis:
    image: redis:7-alpine
    container_name: eazydoc_redis_staging
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_internal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_backend_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RUN_MIGRATIONS=true
      - COLLECT_STATIC=true
    volumes:
      - staging_media_data:/app/media
      - staging_staticfiles_data:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging_internal_network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_celery_staging
    restart: unless-stopped
    command: celery -A config worker -l INFO -c 2
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - staging_internal_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_celery_beat_staging
    restart: unless-stopped
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.staging
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - RUN_MIGRATIONS=false
      - COLLECT_STATIC=false
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - staging_internal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: eazydoc_frontend_staging
    restart: unless-stopped
    networks:
      - staging_internal_network

  nginx:
    image: nginx:1.27-alpine
    container_name: eazydoc_nginx_staging
    restart: unless-stopped
    ports:
      - "${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - staging_media_data:/app/media:ro
      - staging_staticfiles_data:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend
    networks:
      - staging_internal_network

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_media_data:
  staging_staticfiles_data:

networks:
  staging_internal_network:
    driver: bridge

